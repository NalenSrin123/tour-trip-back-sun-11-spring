spring.application.name=tour-trip-api

# Server Configuration
server.port=8080

# Database Datasource Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/tour_trip_db
spring.datasource.username=tour_user
spring.datasource.password=Nalen@300504

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration



